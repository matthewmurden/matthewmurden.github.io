name: fetch-photo
on:
  push:
    paths: ['.github/workflows/fetch-photo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photo from old Webflow site
        run: |
          curl -fsSL "https://cdn.prod.website-files.com/68c7f49a6d62f8336f1f661e/68c9cbb6c788f43921605bfa_Photoroom_20250420_192214.jpg" -o assets/me.jpg
          file assets/me.jpg
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add assets/me.jpg
          git commit -m "Add profile photo from previous site" || echo "nothing to commit"
          git push
